<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Pong 3D</title>
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #000;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #renderCanvas {
      width: 100%; height: 100%;
      position: relative; z-index: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    #hud {
      position: absolute; top: 16px; width: 100%;
      text-align: center; pointer-events: none;
      font-family: 'Courier New', monospace;
      color: #fff; font-size: 36px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
      z-index: 10;
    }
    @media (orientation: portrait) {
      #hud { font-size: 28px; top: 8px; }
      #menu h1 { font-size: 32px; margin-bottom: 20px; }
      .menu-btn { width: 180px; font-size: 18px; padding: 12px 0; }
      #game-over h1 { font-size: 36px; }
    }
    #coins-hud {
      display: none;
      position: absolute; top: 16px; right: 16px;
      font-family: 'Courier New', monospace;
      color: #ffd700; font-size: 16px;
      pointer-events: none; z-index: 10;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
    #game-over {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: #fff;
      font-family: 'Courier New', monospace;
      z-index: 20;
    }
    #game-over h1 { font-size: 48px; margin-bottom: 20px; }
    #btn-restart {
      padding: 12px 32px; font-size: 20px;
      background: #333; color: #fff; border: 2px solid #666;
      cursor: pointer; font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #btn-restart:hover { background: #555; }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-family: monospace; font-size: 20px;
      z-index: 20;
    }
    #menu {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; color: #fff;
      font-family: 'Courier New', monospace;
      z-index: 20;
    }
    #menu h1 { font-size: 42px; margin-bottom: 30px; text-shadow: 0 0 20px rgba(100,150,255,0.5); }
    .menu-btn {
      display: block; width: 220px; margin: 10px auto;
      padding: 14px 0; font-size: 22px;
      background: #222; color: #fff; border: 2px solid #555;
      cursor: pointer; font-family: inherit;
      transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      position: relative;
      z-index: 21;
    }
    .menu-btn:hover { background: #444; border-color: #888; }
    .menu-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    #status {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #aaa; font-family: monospace; font-size: 18px;
      text-align: center;
      z-index: 20;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="hud" style="display:none;"></div>
  <div id="coins-hud"></div>
  <div id="loading">Загрузка...</div>
  <div id="menu">
    <h1>Pong 3D</h1>
    <button type="button" class="menu-btn" id="btn-solo">СОЛО</button>
    <button type="button" class="menu-btn" id="btn-online">ОНЛАЙН</button>
    <div id="online-count" style="color:#aaa; font-size:14px; margin-top:12px;"></div>
    <div id="matches-count" style="color:#777; font-size:13px; margin-top:4px;"></div>
  </div>
  <div id="status">
    <div id="status-text"></div>
    <button type="button" class="menu-btn" id="btn-cancel-search" style="display:none;margin-top:16px;">Отмена</button>
  </div>
  <div id="touch-hint" style="display:none;position:absolute;top:38%;left:50%;
    transform:translate(-50%,-50%);color:#fff;font:600 22px 'Courier New';
    text-shadow:0 0 12px rgba(0,0,0,0.9);pointer-events:none;
    background:rgba(0,0,0,0.55);padding:16px 28px;border-radius:12px;
    z-index:20;opacity:0;transition:opacity 0.3s;text-align:center;
    max-width:80%;"></div>
  <div id="game-over">
    <h1 id="result-text"></h1>
    <button type="button" id="btn-restart">ИГРАТЬ СНОВА</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
